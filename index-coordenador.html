<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fila de Extras - Coordenador</title>
  <meta name="theme-color" content="#000000" />
</head>
<body>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script>
const baseUrl = window.location.origin;
const icon = baseUrl + '/icon.png?v=126';

async function coordenadorAutorizado(t){
  try{
    const [board, member] = await Promise.all([t.board('id'), t.member('id')]);
    if(!board?.id || !member?.id) return false;
    const response = await fetch(`${baseUrl}/api/auth-coordenador?boardId=${encodeURIComponent(board.id)}&memberId=${encodeURIComponent(member.id)}&ts=${Date.now()}`);
    if(!response.ok) return false;
    const result = await response.json();
    return result.autorizado === true;
  }catch(e){
    return false;
  }
}

const abrirPainel = function(t){
  return t.modal({
    title:'Fila de Extras - Coordenador',
    url:'./fila.html?modo=coordenador&v=126',
    height:740,
    fullscreen:false,
    accentColor:'#111827'
  });
};

window.TrelloPowerUp.initialize({
  'board-buttons': async function(t){
    if(!(await coordenadorAutorizado(t))) return [];
    return [{ text:'Fila de Extras - Coordenador', icon, callback:abrirPainel, condition:'signedIn' }];
  },
  'card-buttons': async function(t){
    if(!(await coordenadorAutorizado(t))) return [];
    return [{ text:'Fila de Extras - Coordenador', icon, callback:abrirPainel, condition:'signedIn' }];
  },
  'show-settings': function(t){
    return t.modal({
      title:'Gerenciar coordenadores',
      url:'./gerenciar-coordenadores.html?v=126',
      height:640,
      fullscreen:false,
      accentColor:'#111827'
    });
  },
  'card-badges': function(){ return []; }
}, { appKey:'fila-extras-coordenador' });
</script>
</body>
</html>
