<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fila de Extras - Coordenador</title>
  <meta name="theme-color" content="#000000" />
</head>
<body>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script>
const baseUrl = window.location.origin;
const icon = baseUrl + '/icon.png?v=127';

async function coordenadorAutorizado(t){
  try{
    const member = await t.member('id');
    if(!member?.id) return false;
    const autorizados = await t.get('board', 'shared', 'coordenadoresAutorizados', []);
    return Array.isArray(autorizados) && autorizados.map(id => String(id || '').trim()).includes(String(member.id));
  }catch(e){
    return false;
  }
}

const abrirPainel = function(t){
  return t.modal({
    title:'Fila de Extras - Coordenador',
    url:'./fila.html?modo=coordenador&v=127',
    height:740,
    fullscreen:false,
    accentColor:'#111827'
  });
};

window.TrelloPowerUp.initialize({
  'board-buttons': async function(t){
    if(!(await coordenadorAutorizado(t))) return [];
    return [{ text:'Fila de Extras - Coordenador', icon, callback:abrirPainel, condition:'signedIn' }];
  },
  'card-buttons': async function(t){
    if(!(await coordenadorAutorizado(t))) return [];
    return [{ text:'Fila de Extras - Coordenador', icon, callback:abrirPainel, condition:'signedIn' }];
  },
  'show-settings': function(t){
    return t.modal({
      title:'Gerenciar coordenadores',
      url:'./gerenciar-coordenadores.html?v=127',
      height:640,
      fullscreen:false,
      accentColor:'#111827'
    });
  },
  'card-badges': function(){ return []; }
}, { appKey:'fila-extras-coordenador' });
</script>
</body>
</html>
